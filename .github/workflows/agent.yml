name: Agent — implement ticket

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            You are the design-system agent for ${{ github.repository }}.
            Implement GitHub issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            Issue description:
            ${{ github.event.issue.body }}

            Do this:
            1. Read CLAUDE.md and DESIGN.md.
            2. Take the ticket ID from the issue title or the "Ticket:" line (for example PEB-2).
               Use the base branch named under "Base branch:" (default: main). Run
               `git checkout <base> && git checkout -b <ID>-<short-slug>`.
            3. Make only the change the ticket asks for.
            4. Run `npm run build`. It must pass.
            5. Commit as "<ID>: <short summary>" and push the branch.
            6. Open a draft PR with `gh pr create --draft --base <base>`. Title: "<ID> <summary>".
               Body: what changed; which screenshots should change (brand · mode · section) or "none";
               any token value that moved; and "Closes #${{ github.event.issue.number }}".
            7. Comment on issue #${{ github.event.issue.number }} with the PR link.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm run build),Bash(npm install:*)"
