<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Agents</title>
<style>
/* Layout: top bar, then either Home (start form + recent runs) or Run (step timeline + live preview). */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunken: #eef0f4; --ink: #151a22; --ink-2: #4a5566; --ink-3: #7a8596;
  --line: #e1e5eb; --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e8edff;
  --ok: #188a5b; --ok-soft: #e1f5ec; --run: #b26b00; --run-soft: #fff3df; --bad: #c4372b; --bad-soft: #fde8e6;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1116; --surface: #161b22; --sunken: #1d232c; --ink: #e8edf3; --ink-2: #aab4c2; --ink-3: #7d8899;
  --line: #2a313c; --accent: #7c95ff; --accent-ink: #0e1116; --accent-soft: #1f2747;
  --ok: #4cc38a; --ok-soft: #12291f; --run: #f0a542; --run-soft: #2c2110; --bad: #ff7a6e; --bad-soft: #2f1614;
  color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, 3vw); border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.logo { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 14px; }
.top .repo { font: 12.5px var(--mono); color: var(--ink-3); }
.top .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font); padding: 5px 9px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.run { background: var(--run-soft); color: var(--run); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.run .dot { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }

.page { max-width: 1240px; margin: 0 auto; padding: 28px max(16px, 3vw) 64px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Home */
.hero h1 { font-size: clamp(30px, 4.5vw, 46px); line-height: 1.05; letter-spacing: -.03em; margin: 0 0 10px; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 0 0 24px; color: var(--ink-2); max-width: 62ch; }
.home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.start { padding: 20px; }
.start h2, .recent h2 { font-size: 17px; margin: 0 0 4px; }
.agents { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
.agent { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.agent.on { border-color: var(--accent); background: var(--accent-soft); }
.agent.off { opacity: .55; }
.agent b { display: block; font-size: 14px; }
.agent small { color: var(--ink-3); font-size: 12px; }
.ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; font-weight: 700; }
label.f { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
.templates { display: flex; gap: 6px; flex-wrap: wrap; }
.tpl { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.tpl[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
input.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; }
textarea.t { min-height: 180px; resize: vertical; font: 13px/1.5 var(--mono); }
.start .go { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; }
.recent { padding: 20px; }
.runs { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
.runs li a { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 11px 4px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.runs li a:hover { background: var(--sunken); }
.runs .tt { min-width: 0; }
.runs .tt b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-3); font-size: 14px; margin-top: 12px; }

/* Run */
.crumb { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.crumb a { color: var(--ink-3); text-decoration: none; }
.runhead { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.runhead h1 { font-size: clamp(22px, 3vw, 28px); letter-spacing: -.02em; margin: 0; line-height: 1.2; }
.runhead .links { display: flex; gap: 8px; flex-wrap: wrap; }
.runbody { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { padding: 10px; position: sticky; top: 76px; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li a { display: flex; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; }
.rail li a:hover { background: var(--sunken); }
.rail li.cur a { background: var(--accent-soft); }
.st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; border: 1.5px solid var(--line); color: var(--ink-3); background: var(--surface); }
.st.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.st.active { border-color: var(--run); color: var(--run); }
.st.active::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: blink 1s infinite; }
.st.fail { background: var(--bad); border-color: var(--bad); color: #fff; }
.st.wait { border-color: var(--accent); color: var(--accent); }
.rail .meta { margin: 10px 8px 4px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }

.steps { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step { padding: 16px 18px; scroll-margin-top: 80px; }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step header { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.step h3 { margin: 0; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.step .desc { margin: 6px 0 0 32px; color: var(--ink-2); font-size: 14px; }
.step .body { margin: 12px 0 0 32px; min-width: 0; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.checklist .st { width: 18px; height: 18px; font-size: 10px; }
.checklist .st.active::after { width: 6px; height: 6px; }
pre.ticket { margin: 0; white-space: pre-wrap; font: 12.5px/1.55 var(--mono); background: var(--sunken); border-radius: 8px; padding: 12px; max-height: 220px; overflow: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kv div { background: var(--sunken); border-radius: 8px; padding: 10px 12px; }
.kv small { display: block; color: var(--ink-3); font-size: 12px; }
.kv b { font-size: 15px; }
.big { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
table.vd { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
table.vd td { padding: 6px 8px; border-top: 1px solid var(--line); }
table.vd td:last-child { text-align: right; font-family: var(--mono); color: var(--ink-2); }
.review { white-space: pre-wrap; font-size: 13.5px; background: var(--sunken); border-radius: 8px; padding: 12px; margin-top: 10px; max-height: 260px; overflow: auto; }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--run-soft); color: var(--ink); font-size: 14px; }
.callout.bad { background: var(--bad-soft); }
.callout.ok { background: var(--ok-soft); }

.preview .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.frame { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sunken); display: flex; justify-content: center; }
.frame iframe { border: 0; width: 100%; height: 640px; background: #fff; transition: width .25s; }
.frame.mobile iframe { width: 390px; max-width: 100%; }
.placeholder { padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 14px; width: 100%; }
.auth { display: flex; gap: 8px; align-items: center; }
.me { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.me img { width: 22px; height: 22px; border-radius: 50%; }
.runs .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 4px; border-top: 1px solid var(--line); }
.runs .row:hover { background: var(--sunken); }
.runs a.tt { display: block; padding: 0; border: 0; color: var(--ink); text-decoration: none; min-width: 0; flex: 1; }
.runs a.tt:hover { background: none; }
.runs a.tt > span { display: block; }
.runs li { border: 0; }
.runs .lk { color: var(--accent); cursor: pointer; }
.runs .lk:hover { text-decoration: underline; }
details.custom { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
details.custom summary { font-size: 14px; font-weight: 600; color: var(--ink); }
.btn:disabled { opacity: .6; cursor: progress; }
.sandbox-link { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.sandbox-link .mono { color: var(--ink-3); overflow-wrap: anywhere; }
.foot { margin-top: 28px; font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.foot #resetBtn { margin-left: auto; }

@media (max-width: 860px) {
  .top .repo { display: none; }
  .home, .runbody { grid-template-columns: 1fr; }
  .rail { position: static; }
  .step .desc, .step .body { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="#"><i>P</i>Pebble Agents</a>
  <span class="repo" id="repoLabel"></span>
  <span class="sp"></span>
  <span class="pill" id="live" title="GitHub API calls left this hour">…</span>
  <span class="auth" id="auth"></span>
</div>
<div class="page" id="app"></div>

<script>
/* ---------------- Config ---------------- */
const Q = new URLSearchParams(location.search);
const REPO = Q.get("repo") || "dustinweeres82/pebble-pay-sandbox";
const DEMO = Q.has("demo");
const GH = "https://api.github.com/repos/" + REPO;
const TICKETS = [{"id": "PEB-1", "title": "Add semantic tokens (no visual change)", "body": "Base branch: main\n\n## Why\nStep 1 of 3: semantic token alignment. The legacy templates paint with palette classes and\n`dark:` twins. Before moving them, the token layer needs every role they use, set to exactly\nwhat they render today.\n\n## Do\n- In `src/styles/theme_pebble.css`, add these roles to the light block and the dark block (light → dark):\n  - per intent (`primary` ocean, `info` sky, `success` leaf, `warning` sun, `destructive` ember):\n    `-hover` (200 → 200), `-active` (700 → 600; warning 700 → 650), `-subtle` (100 → stone-700), `-emphasis` (500 → 500)\n  - `caution` sun-650 → sun-400\n  - `on-hover` stone-800 → stone-800, `on-active` stone-200 → stone-900, `focus-border` stone-600 → stone-50\n  - `disabled` stone-200 → stone-700, `disabled-foreground` stone-500 → stone-400\n  - `field` white → stone-900, `field-border` stone-300 → stone-700, `field-focus` sky-600 → sky-400,\n    `field-placeholder` stone-500 → stone-500, `field-help` stone-500 → stone-400\n  - `sidebar` ocean-900 → stone-900, `sidebar-foreground` white → white, `sidebar-muted` stone-300 → stone-300,\n    `sidebar-primary` ocean-400 → ocean-400, `sidebar-accent` white at 10% → white at 10%,\n    `sidebar-border` white at 15% → white at 15% (write the white-at-N% values as `color-mix(in srgb, var(--color-white) N%, transparent)`)\n- Map each in `src/styles/shadcn_base.css` (`@theme inline`). The `sidebar-*` mappings already exist\n  (Partner's React nav uses them); only add Pebble's values for those. For every other new role, add a\n  fallback derived from shadcn roles in a `@layer base` block, so Partner still resolves it.\n- Add a token table to DESIGN.md.\n- Don't change any component, template or page, and don't edit `theme_partner.css`.\n\n## Done when\n- `npm run build` passes.\n- Visual diff: **0 of 68 screenshots changed.**"}, {"id": "PEB-2", "title": "Legacy templates on tokens (no visual change for Pebble)", "body": "Base branch: main\n\n## Why\nStep 1 of 3, continued. Today a color, dark-mode or brand change has to be repeated in every\nlegacy template. After this, it's made once in the theme, the same way the React components already work.\n\n## Do\n- In `src/legacy/templates.js`, replace every palette class and `dark:` variant with semantic tokens:\n  - buttons → `bg-<intent>` + `text-primary-foreground`; secondary theme → `bg-background` + `text-<intent>`;\n    hover/active → `<intent>-hover` / `<intent>-active` (caution uses `caution` for the fill and `warning-*` for states);\n    `on-hover`, `on-active`, `focus-border`, `disabled`, `disabled-foreground`\n  - text button, breadcrumb → `text-primary`; title, labels, table text → `text-foreground`\n  - alerts → `<intent>-subtle` surface, `<intent>-emphasis` border and icon, `text-foreground`\n    (caution → warning, destruction → destructive)\n  - badges → `bg-success` / `bg-warning` / `bg-destructive` / `bg-info` + `text-primary-foreground`\n  - fields and selects → `field`, `border`, `field-border`, `field-focus`, `field-placeholder`, `field-help`, `disabled*`\n  - table → `border`, striped rows `bg-card`\n  - nav → `sidebar`, `sidebar-foreground`, `sidebar-muted`, `sidebar-primary`, `sidebar-accent`, `sidebar-border`\n  - support banner → `bg-muted`\n- Keep every function signature the same. Don't touch `src/pages/` or `src/components/ui/`.\n\n## Done when\n- `src/legacy/` has no palette classes and no `dark:`.\n- Visual diff: **0 of 68 screenshots changed.** Pebble's legacy pages look exactly the same, and\n  Partner doesn't use the legacy templates (it renders the React pages)."}, {"id": "PEB-3", "title": "Align shadcn components to Pebble's tokens", "body": "Base branch: main\n\n## Why\nStep 2 of 3. Partner's pages are already built with the React (shadcn) components. Before Pebble\nmoves onto them, they need the intents Pebble uses (success, warning, info, caution) and the field\ntokens, so they look right in Pebble without one-off styles. Shapes, sizes and structure stay stock.\n\n## Do\n- `src/components/ui/badge.jsx`: add `success`, `warning`, `info` variants\n  (`bg-<intent> text-primary-foreground`, same shape as `default`).\n- `src/components/ui/alert.jsx`: add `info`, `success`, `warning` variants using `<intent>-subtle`\n  surface and `<intent>-emphasis` border; point `destructive` at `destructive-subtle` / `destructive-emphasis`.\n  Keep the stock radius, border width and padding.\n- `src/components/ui/button.jsx`: add a `caution` variant (`bg-caution text-primary-foreground`, stock shape).\n- `input.jsx`, `native-select.jsx`, `textarea.jsx`: background `bg-field`, border `border-field-border`,\n  placeholder `placeholder:text-field-placeholder`, focus ring `ring-field-focus`. Keep stock height and radius.\n- Use the new variants in the React pages: in `PayoutsReact.jsx` status badges `success` (Completed),\n  `warning` (Processing), `destructive` (Failed) and the BETA badge `info`; in `CreatePaymentReact.jsx` the alert\n  `info`; in `src/components/AppNav.jsx` the BETA badge `info`.\n- On the Components page, add one example of each new variant.\n- Add a \"shadcn on Pebble tokens\" table to DESIGN.md (component → variant → tokens).\n- Don't change shapes or sizes, and don't touch `src/legacy/` or the legacy pages.\n\n## Done when\n- Visual diff: `components-*` change in both brands. Partner's `payouts-header`, `payouts-table`,\n  `create-alert` and `*-nav` change (intent colors on badges and the alert). Pebble's product pages don't change."}, {"id": "PEB-4", "title": "Port the Off-cycle payouts page to React", "body": "Base branch: main\n\n## Why\nStep 3 of 3: React. Partner already renders Off-cycle payouts with the React components\n(`src/pages/PayoutsReact.jsx`). Now that those components speak Pebble's tokens, Pebble can use the\nsame page, and the legacy version goes away.\n\n## Do\n- In `src/App.jsx`, render `<PayoutsReact />` for every brand on the `payouts` page.\n- Delete `src/pages/PayoutsLegacy.jsx`.\n- If anything on the page looks off in Pebble, fix it with tokens or the component's variants,\n  not with one-off colors. Keep every `data-testid` and the content.\n- Don't edit `src/legacy/templates.js` (the other page and the nav still use it).\n\n## Done when\n- Visual diff: Pebble's `payouts-header`, `payouts-switcher`, `payouts-filters` and `payouts-table` change\n  (light and dark; legacy look → shadcn on Pebble's tokens). Nothing changes for Partner.\n- \"Show components\" on Pebble's Payouts page shows `ui/…` labels everywhere except the nav."}, {"id": "PEB-5", "title": "Port the Create a payment page to React", "body": "Base branch: main\n\n## Why\nStep 3 of 3, continued: the second page moves Pebble onto `src/pages/CreatePaymentReact.jsx`,\nwhich Partner already uses.\n\n## Do\n- In `src/App.jsx`, render `<CreatePaymentReact />` for every brand on the `create` page.\n- Delete `src/pages/CreatePaymentLegacy.jsx`.\n- Fix anything that looks off in Pebble with tokens or variants only. Keep every `data-testid` and the content.\n- Don't edit `src/legacy/templates.js` (the nav still uses it).\n\n## Done when\n- Visual diff: Pebble's `create-header`, `create-alert`, `create-form`, `create-actions` and `create-support`\n  change (light and dark). Nothing changes for Partner."}, {"id": "PEB-6", "title": "Port the navigation and remove the legacy templates", "body": "Base branch: main\n\n## Why\nStep 3 of 3, finished. The nav is the last piece on the legacy templates. Partner already uses the\nReact nav (`src/components/AppNav.jsx`). Once Pebble does too, `src/legacy/` can be deleted and every\nbrand renders from one set of components.\n\n## Do\n- In `src/App.jsx`, render `<AppNav />` (inside the `data-testid=\"nav\"` wrapper) for every brand.\n- Delete `src/legacy/templates.js`, the `Legacy` helper in `src/shell.jsx` if nothing uses it, and any import of them.\n- Remove the legacy rows from DESIGN.md.\n\n## Done when\n- `npm run build` passes and nothing imports `src/legacy/`.\n- Visual diff: only Pebble's `*-nav` screenshots change (every page, light and dark). Nothing changes for Partner."}];
document.getElementById("repoLabel").textContent = REPO + (DEMO ? " · demo mode" : "");

/* ---------------- Small helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = iso => { if (!iso) return ""; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
const dur = (a, b) => { if (!a) return ""; const s = Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------------- GitHub API (conditional requests; 304s don't use up the rate limit) ---------------- */
/* Signed in: calls go through /api/gh as you (5,000 an hour, and the console can add labels).
   Signed out: anonymous calls straight to GitHub (60 an hour, read-only). */
let auth = { available: false, signedIn: false };
async function loadAuth() {
  if (DEMO) return;
  try {
    const r = await fetch("/api/me", { cache: "no-store" });
    const ct = r.headers.get("content-type") || "";
    if (!ct.includes("json")) return; // no functions here (for example plain `npm run dev`)
    const j = await r.json();
    auth = { available: j.configured !== false, signedIn: !!j.signedIn, login: j.login, avatar: j.avatar };
  } catch {}
}
function drawAuth() {
  const el = $("#auth");

  else if (!run) Object.assign(b, { state: "active", desc: "Waiting for GitHub Actions to pick up the job…" });

  else if (run.conclusion !== "success") Object.assign(b, { state: "fail", desc: `The agent run ended with “${run.conclusion}”. Open the log to see why.` });
  else if (!pr) Object.assign(b, { state: "fail", desc: "The agent finished but didn't open a PR. Usually the change was already on main, or the branch name was taken. Reset the demo and try again." });
  else Object.assign(b, { state: "done", desc: `Finished in ${dur(run.created_at, run.updated_at)} and opened PR #${pr.number}.` });

  else if (m.preview?.failed) Object.assign(p, { state: "fail", desc: "The Vercel build for this PR failed. Open the build log to see why." });

  try { m = DEMO ? demoModel(id) : await liveModel(id, startedAt); }
  catch (e) {
    $("#steps").innerHTML = `<div class="card step"><div class="callout bad">${e.message === "rate" ? `GitHub's hourly limit for anonymous requests is used up. Live updates resume ${rate.reset ? "at " + new Date(rate.reset).toLocaleTimeString() : "within the hour"}.` : esc(e.message)}</div></div>`;
    updateLive(); timer = setTimeout(() => route(), 60000); return;
  }
  if (viewKey !== "run:" + id) return;
  drawRun(m);
  updateLive();
  const finished = m.pr && (m.pr.merged_at || m.pr.state === "closed");
  const failed = m.run && m.run.status === "completed" && (m.run.conclusion !== "success" || !m.pr);
  if (!finished && !(failed && !DEMO)) {
    const low = rate.left !== null && rate.left < 10;
    timer = setTimeout(() => route(), DEMO ? 1000 : low ? 60000 : m.run && m.run.status !== "completed" ? 10000 : 15000);
  }
}
function drawRun(m) {
  const S = stages(m);
  const cur = (S.find(s => s.state === "active" || s.state === "fail" || s.state === "wait") || S[S.length - 1]).key;
  $("#rtitle").textContent = m.issue ? m.issue.title : `${m.id} · waiting for the issue`;
  $("#rlinks").innerHTML = [
    m.issue && `<a class="btn sm" href="${m.issue.html_url}" target="_blank" rel="noopener">Issue #${m.issue.number}</a>`,
    m.run && `<a class="btn sm" href="${m.run.html_url}" target="_blank" rel="noopener">Agent log</a>`,
    m.pr && `<a class="btn sm" href="${m.pr.html_url}" target="_blank" rel="noopener">PR #${m.pr.number}</a>`,
    m.preview?.url && !m.preview.demo && `<a class="btn sm primary" href="${m.preview.url}" target="_blank" rel="noopener">Open sandbox ↗</a>`,
    auth.signedIn && m.issue && m.run && m.run.status === "completed" && !(m.pr && m.pr.merged_at) && `<button class="btn sm" id="again">Run again</button>`].filter(Boolean).join("");
  const again = $("#again"); if (again) again.onclick = () => runAgain(m, again);
  $("#rail").innerHTML = S.map((s, i) => `<li class="${s.key === cur ? "cur" : ""}"><a href="#run/${encodeURIComponent(m.id)}" data-jump="${s.key}"><span class="st ${s.state}">${s.state === "active" ? "" : ICON[s.state] || i + 1}</span>${s.name}</a></li>`).join("");
  $("#rmeta").innerHTML = m.issue ? `Started ${ago(m.startedAt || m.issue.created_at)}` : "";
  document.querySelectorAll("[data-jump]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById("step-" + a.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); });

  const bodies = {
    request: () => m.issue ? `<details><summary>Ticket the agent received</summary><pre class="ticket">${esc(m.issue.body || "")}</pre></details>` : "",
    build: () => m.steps?.length ? `<ul class="checklist">${m.steps.map(s => { const st = s.status === "completed" ? (s.conclusion === "success" || s.conclusion === "skipped" ? "done" : "fail") : s.status === "in_progress" ? "active" : "todo";
      return `<li><span class="st ${st}">${st === "done" ? "✓" : st === "fail" ? "!" : ""}</span>${esc(s.name)}</li>`; }).join("")}</ul>` : "",
    review: () => {
      if (!m.pr) return "";
      const v = m.visual, chg = v && v.changed !== null;
      return `<div class="kv">
        <div><small>Visual diff</small>${chg ? `<span class="big">${v.changed} of ${v.total}</span><br><span class="small muted">screenshots changed</span>` : `<b>Running…</b>`}</div>
        <div><small>AI review</small>${m.review ? `<b>${/needs attention/i.test(m.review.text) ? "Has findings" : "Posted"}</b>` : "<b>Running…</b>"}</div>
        <div><small>Change size</small><b>${m.pr.changed_files ?? "–"} files</b>${m.pr.additions != null ? `<br><span class="small muted">+${m.pr.additions} −${m.pr.deletions}</span>` : ""}</div></div>
        ${chg && v.rows.length ? `<table class="vd">${v.rows.slice(0, 12).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>` : ""}
        ${chg ? `<p class="small muted" style="margin:8px 0 0">Compare against the ticket's “Done when”. Diff images are in the <a href="${v.url}" target="_blank" rel="noopener">Visual diff run</a>.</p>` : ""}
        ${m.review ? `<div class="review">${esc(m.review.text.slice(0, 1600))}</div>` : ""}`;
    },
    preview: () => m.pr ? previewHTML(m) : "",
    ship: () => m.pr && !m.pr.merged_at && m.pr.state === "open" ? `<a class="btn primary" href="${m.pr.html_url}" target="_blank" rel="noopener">Review &amp; merge on GitHub ↗</a>` : "",
  };
  // Patch each step in place, and only touch a part whose HTML changed, so the preview iframe doesn't reload on every poll.
  const host = $("#steps");
  if (host.children.length !== S.length) host.innerHTML = S.map(s => `<section class="card step" id="step-${s.key}"><div class="hd"></div><div class="bd"></div></section>`).join("");
  S.forEach((s, i) => {
    const sec = document.getElementById("step-" + s.key);
    sec.classList.toggle("cur", s.key === cur);
    const hd = `<header><h3><span class="st ${s.state}">${s.state === "active" ? "" : ICON[s.state] || i + 1}</span>${s.name}</h3>${statusPill(s.state)}</header><p class="desc">${esc(s.desc)}</p>`;
    const b = bodies[s.key](); const bd = b ? `<div class="body">${b}</div>` : "";
    const h = sec.querySelector(".hd"), d = sec.querySelector(".bd");
    if (h._html !== hd) { h.innerHTML = hd; h._html = hd; }
    if (d._html !== bd) { d.innerHTML = bd; d._html = bd; if (s.key === "preview") wirePreview(m); }
  });
}
function previewURL(m) {
  const u = m.preview.url.replace(/\/$/, "");
  return `${u}/?brand=${prevOpts.brand}&theme=${prevOpts.theme}`;
}
function previewHTML(m) {
  if (!m.preview?.url) {
    const p = m.preview || {};
    const msg = p.failed ? "The Vercel build failed." : p.pending ? "Vercel is building the sandbox…" : "Waiting for Vercel to post the sandbox link on the PR.";
    return `<div class="frame"><div class="placeholder">${msg}${p.log ? `<br><a href="${esc(p.log)}" target="_blank" rel="noopener">Vercel build log ↗</a>` : ""}</div></div>`;
  }
  const b = (k, v, label) => `<button data-${k}="${v}" aria-pressed="${prevOpts[k] === v}">${label}</button>`;
  return `<div class="preview">
    ${m.preview.demo ? "" : `<div class="sandbox-link"><a class="btn primary" href="${previewURL(m)}" target="_blank" rel="noopener">Open sandbox ↗</a>
      <span class="mono">${esc(m.preview.url.replace(/^https:\/\//, ""))}</span></div>`}
    <div class="bar">
      <span style="display:flex;gap:8px;flex-wrap:wrap"><span class="seg">${b("brand", "pebble", "Pebble")}${b("brand", "partner", "Partner")}</span>
      <span class="seg">${b("theme", "light", "Light")}${b("theme", "dark", "Dark")}</span>
      <span class="seg">${b("size", "desktop", "Desktop")}${b("size", "mobile", "Mobile")}</span></span>
      ${m.preview.log ? `<a class="small" href="${esc(m.preview.log)}" target="_blank" rel="noopener">Vercel build ↗</a>` : ""}</div>
    <div class="frame ${prevOpts.size}">${m.preview.demo ? `<div class="placeholder">In a live run, the Vercel preview of the PR loads here.</div>` : `<iframe id="pframe" title="Preview of the PR" src="${previewURL(m)}"></iframe>`}</div>
    <p class="small muted" style="margin:8px 0 0">Seeing a Vercel login instead of the app? Preview protection blocks embedding. Turn off Vercel Authentication for this project under Settings → Deployment Protection, or use Open sandbox.</p></div>`;
}
function wirePreview(m) {
  document.querySelectorAll(".preview [data-brand],.preview [data-theme],.preview [data-size]").forEach(btn => btn.onclick = () => {
    const k = ["brand", "theme", "size"].find(x => btn.dataset[x]); prevOpts[k] = btn.dataset[k];
    const d = document.querySelector("#step-preview .bd");
    if (d) { const bd = `<div class="body">${previewHTML(m)}</div>`; d.innerHTML = bd; d._html = bd; wirePreview(m); }
  });
}
function updateLive() {
  const el = $("#live");
  if (DEMO) { el.className = "pill acc"; el.innerHTML = "Demo data"; return; }
  if (rate.left === null) { el.className = "pill"; el.textContent = "Live"; return; }
  el.className = "pill " + (rate.left < 10 ? "bad" : "ok");
  el.innerHTML = `<span class="dot"></span>Live · ${rate.left} calls left`;
}
loadAuth().then(() => { drawAuth(); route(); });
</script>
</body>
</html>
